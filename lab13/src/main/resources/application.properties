spring.application.name=lab13

# H2, in memory. The database lives and dies with the process.
spring.datasource.url=jdbc:h2:mem:lab13;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Run schema.sql then data.sql on startup.
spring.sql.init.mode=always

# Browsable at http://localhost:8080/h2-console
spring.h2.console.enabled=true
